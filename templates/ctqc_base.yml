  # ── BEELDKWALITEIT_DS ───────────────────────────────────────────────────────
  beeldkwaliteit_ds:
    sheet_name: "Beeldkwaliteit_DS"
    inject_columns:
      recon_type: "FBP"
      source_type: "dual_source"
    is_dual_source: true
    is_iterative: false

    referentieopname:
      note: "Paramètres de la scan de référence (fantôme Catphan, 120 kV)."
      patient_name:   { row: 4,  col: "D", dtype: string }
      protocol:       { row: 6,  col: "D", dtype: string }
      ref_kVp:        { row: 7,  col: "D", dtype: int,    unit: kV }
      eff_mAs:        { row: 8,  col: "D", dtype: float,  unit: mAs }
      collimatie:     { row: 9,  col: "D", dtype: string }
      rotatietijd_s:  { row: 10, col: "D", dtype: float,  unit: s }
      pitch:          { row: 11, col: "D", dtype: float }
      snededikte_mm:  { row: 12, col: "D", dtype: float,  unit: mm }
      CTDIvol_mGy:    { row: 13, col: "D", dtype: float,  unit: mGy }
      FOV_mm:         { row: 14, col: "D", dtype: int,    unit: mm }
      scanmode:       { row: 15, col: "D", dtype: string }

    referentiescan:
      note: >
        Paramètres de la scan QA effective (dual source : deux tubes).
        Les kV et mAs sont encodés sous forme "tubeA / tubeB" (ex: "100 / Sn150", "177 / 98").
        Les kV alternatifs (80/Sn150, 90/Sn150) et leurs mAs/CTDI sont en rows 31–32.
      patient_name:   { row: 19, col: "D", dtype: string }
      protocol:       { row: 20, col: "D", dtype: string }
      ref_kVp:        { row: 21, col: "D", dtype: string,
                        note: "Format 'tubeA / tubeB' ex: '100 / Sn150'" }
      eff_mAs:        { row: 22, col: "D", dtype: string,
                        note: "Format 'tubeA / tubeB' ex: '177 / 98'" }
      collimatie:     { row: 23, col: "D", dtype: string }
      rotatietijd_s:  { row: 24, col: "D", dtype: float,  unit: s }
      pitch:          { row: 25, col: "D", dtype: float }
      snededikte_mm:  { row: 26, col: "D", dtype: float,  unit: mm }
      CTDIvol_mGy:    { row: 27, col: "D", dtype: float,  unit: mGy }
      FOV_mm:         { row: 28, col: "D", dtype: int,    unit: mm }
      scanmode:       { row: 29, col: "D", dtype: string }
      kernel_soft:    { row: 31, col: "D", dtype: string,
                        note: "Ex: 'Br40'" }
      kernel_hard:    { row: 32, col: "D", dtype: string,
                        note: "Ex: 'Br59'" }
      alt_kV_low:     { row: 31, col: "G", dtype: string,
                        note: "kV alternatif bas ex: '80 / Sn150'" }
      alt_mAs_low:    { row: 31, col: "H", dtype: float,  unit: mAs }
      alt_CTDI_low:   { row: 31, col: "I", dtype: float,  unit: mGy }
      alt_kV_high:    { row: 32, col: "G", dtype: string,
                        note: "kV alternatif haut ex: '90 / Sn150'" }
      alt_mAs_high:   { row: 32, col: "H", dtype: float,  unit: mAs }
      alt_CTDI_high:  { row: 32, col: "I", dtype: float,  unit: mGy }

    CT_getal_lineair_mixed:
      note: >
        Sensitométrie sur image mixed (combinaison tubes A+B).
        6 combinaisons filtre × kVp : Br40/Br59 × 100/Sn150, 80/Sn150, 90/Sn150.
        Les HU mesurés (cols C–J) sont les données primaires à stocker.
        Les cols K–S contiennent les données CodeImageJ (tube B référence) :
          col K = label encodé "HU kVp: mAs: slice: kernel",
          cols L–S = HU des 8 matériaux (même ordre que C–J).
      db_table: "iq/DS_CT_getal_lineair_mixed"
      header_row: 38
      data_start_row: 39
      end_condition:
        type: n_rows
        n: 6
      columns:
        filter_kV_label:  { col: "A", dtype: string,
                            note: "Ex: 'Filter: Br40 - 100 / Sn150 kV'" }
        HU_lucht:         { col: "C", dtype: float, unit: HU }
        HU_PMP:           { col: "D", dtype: float, unit: HU }
        HU_LDPE:          { col: "E", dtype: float, unit: HU }
        HU_water:         { col: "F", dtype: float, unit: HU }
        HU_polystyreen:   { col: "G", dtype: float, unit: HU }
        HU_acrylic:       { col: "H", dtype: float, unit: HU }
        HU_delrin:        { col: "I", dtype: float, unit: HU }
        HU_teflon:        { col: "J", dtype: float, unit: HU }

    CT_getal_lineair_buisB:
      note: >
        Sensitométrie tube B seul, à 100/Sn150 kV uniquement (2 lignes : Br40 + Br59).
        Même structure de colonnes que CT_getal_lineair_mixed.
      db_table: "iq/DS_CT_getal_lineair_buisB"
      header_row: 78
      data_start_row: 79
      end_condition:
        type: n_rows
        n: 2
      columns:
        filter_kV_label:    { col: "A", dtype: string }
        HU_lucht:           { col: "C", dtype: float, unit: HU }
        HU_PMP:             { col: "D", dtype: float, unit: HU }
        HU_LDPE:            { col: "E", dtype: float, unit: HU }
        HU_water:           { col: "F", dtype: float, unit: HU }
        HU_polystyreen:     { col: "G", dtype: float, unit: HU }
        HU_acrylic:         { col: "H", dtype: float, unit: HU }
        HU_delrin:          { col: "I", dtype: float, unit: HU }
        HU_teflon:          { col: "J", dtype: float, unit: HU }

    HU_water_lucht_mixed:
      note: >
        Vérification HU eau et HU air sur image mixed.
        6 lignes (Br40/Br59 × 3 kVp).
        Critères : |HU_water| < 10 HU, HU_lucht dans tolérance.
        Cols Q–S = données CodeImageJ (HU + SD) pour traçabilité.
      db_table: "iq/DS_HU_water_lucht_mixed"
      header_row: 110
      data_start_row: 111
      end_condition:
        type: n_rows
        n: 6
      columns:
        filter_kV_label: { col: "A", dtype: string }
        HU_water:        { col: "C", dtype: float, unit: HU }
        limiet_water:    { col: "D", dtype: string }
        pass_fail_water: { col: "E", dtype: string }
        HU_lucht:        { col: "H", dtype: float, unit: HU }
        pass_fail_lucht: { col: "J", dtype: string }
        pass_fail_total: { col: "L", dtype: string, optional: true }
      totaal:
        pass_fail_water: { row: 117, col: "L", dtype: string }
        pass_fail_lucht: { row: 117, col: "N", dtype: string }

    HU_water_lucht_buisB:
      note: >
        Vérification HU eau et HU air tube B seul.
        Seules 2 lignes sont valides (100/Sn150 kV, Br40 + Br59).
        Les autres lignes (80/Sn150, 90/Sn150) contiennent NVT.
        Parser : ignorer les lignes où pass_fail == "NVT".
      db_table: "iq/DS_HU_water_lucht_buisB"
      header_row: 118
      data_start_row: 119
      end_condition:
        type: n_rows
        n: 6
      skip_if_value: "NVT"
      skip_col: "E"
      columns:
        filter_kV_label: { col: "A", dtype: string }
        HU_water:        { col: "C", dtype: float, unit: HU }
        limiet_water:    { col: "D", dtype: string }
        pass_fail_water: { col: "E", dtype: string }
        HU_lucht:        { col: "H", dtype: float, unit: HU }
        pass_fail_lucht: { col: "J", dtype: string }
      totaal:
        pass_fail_water: { row: 125, col: "L", dtype: string }
        pass_fail_lucht: { row: 125, col: "N", dtype: string }

    uniformiteit_mixed:
      note: >
        Uniformité sur image mixed.
        12 lignes de données : 6 kVp × 2 sous-lignes (HU row, SD row).
        Col B indique "HU" ou "SD". ROI centraal–links en cols C–G, gemiddelde en H,
        Max. Uniformiteit HU en I, Max. Uniformiteit (%) en J.
        Les named_results (UNIFDS...FBP) en col AG sont sur les lignes HU uniquement
        (rows 131, 133, 135, 137, 139, 141).
      db_table: "iq/DS_uniformiteit_mixed"
      header_row: 130
      data_start_row: 131
      end_condition:
        type: n_rows
        n: 12
      columns:
        filter_kV_label:   { col: "A", dtype: string }
        row_type:          { col: "B", dtype: string,
                             note: "'HU' ou 'SD'" }
        ROI_centraal:      { col: "C", dtype: float }
        ROI_boven:         { col: "D", dtype: float }
        ROI_rechts:        { col: "E", dtype: float }
        ROI_onder:         { col: "F", dtype: float }
        ROI_links:         { col: "G", dtype: float }
        gemiddelde:        { col: "H", dtype: float }
        max_unif_HU:       { col: "I", dtype: float, unit: HU }
        max_unif_pct:      { col: "J", dtype: float }
      named_results:
        note: "Col AG sur les lignes HU (rows 131, 133, 135, 137, 139, 141)."
        UNIFDS120SoftFBP:  { row: 131, col: "AG", dtype: string }
        UNIFDS120HardFBP:  { row: 133, col: "AG", dtype: string }
        UNIFDS140SoftFBP:  { row: 135, col: "AG", dtype: string }
        UNIFDS140HardFBP:  { row: 137, col: "AG", dtype: string }
        UNIFDS100SoftFBP:  { row: 139, col: "AG", dtype: string }
        UNIFDS100HardFBP:  { row: 141, col: "AG", dtype: string }
      summary_table:
        note: "Résumé par filtre+kVp : Max. Uniformiteit HU vs limiet, pass_fail."
        db_table: "iq/DS_uniformiteit_mixed_summary"
        header_row: 144
        data_start_row: 145
        end_condition:
          type: n_rows
          n: 6
        columns:
          filter_kV_label: { col: "A", dtype: string }
          max_unif_HU:     { col: "B", dtype: float, unit: HU }
          limiet_HU:       { col: "C", dtype: float, unit: HU }
          pass_fail:       { col: "D", dtype: string }
      pass_fail_totaal:    { row: 129, col: "K", dtype: string }

    uniformiteit_buisB:
      note: >
        Uniformité tube B seul, à 100/Sn150 kV uniquement.
        4 lignes : Br40 + Br59 × 2 sous-lignes (HU + SD).
      db_table: "iq/DS_uniformiteit_buisB"
      header_row: 157
      data_start_row: 158
      end_condition:
        type: n_rows
        n: 4
      columns:
        filter_kV_label:   { col: "A", dtype: string }
        row_type:          { col: "B", dtype: string,
                             note: "'HU' ou 'SD'" }
        ROI_centraal:      { col: "C", dtype: float }
        ROI_boven:         { col: "D", dtype: float }
        ROI_rechts:        { col: "E", dtype: float }
        ROI_onder:         { col: "F", dtype: float }
        ROI_links:         { col: "G", dtype: float }
        gemiddelde:        { col: "H", dtype: float }
        max_unif_HU:       { col: "I", dtype: float, unit: HU }
        max_unif_pct:      { col: "J", dtype: float }
      summary_table:
        note: "2 lignes de résumé (Br40 + Br59)."
        db_table: "iq/DS_uniformiteit_buisB_summary"
        header_row: 163
        data_start_row: 164
        end_condition:
          type: n_rows
          n: 2
        columns:
          filter_kV_label: { col: "A", dtype: string }
          max_unif_HU:     { col: "B", dtype: float, unit: HU }
          limiet_HU:       { col: "C", dtype: float, unit: HU }
          pass_fail:       { col: "D", dtype: string }
      pass_fail_totaal:    { row: 154, col: "Q", dtype: string }

    artefacten:
      note: "Pass/fail visuel unique — pas de valeur numérique à stocker."
      pass_fail: { row: 169, col: "H", dtype: string }

