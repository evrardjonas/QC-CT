      ref_kernel_table:
        row: 24
        cols: { K: label, L: siemens_soft, M: siemens_hard, N: philips, O: toshiba, P: GE }

    controle_RDS:                            # ligne 19 col N/O
      DLP_mGycm:       { row: 20, col: "O", dtype: float }
      CTDIvol_mGy:     { row: 21, col: "O", dtype: float }

