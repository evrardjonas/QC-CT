# (généré pour le projet CT-QC)
# VERSION CORRIGÉE — corrections appliquées le 2026-05-16

workbook:
  version: "6.8"
  description: "Extraction semi-automatique des résultats QA CT vers base de données CT-QC"

sheets:

  algemene_informatie:
    sheet_name: "Algemene Informatie"
    sections:

      qa_visit:
        db_table: "meta/qa_visit"
        date_test:        { row: 2,  col: "B", dtype: date,
                            note: "Format Excel date serial → parser.to_date()" }
        reference_QC:     { row: 2,  col: "E", dtype: string,
                            note: "Ex: 'QC300_0624_01504CT-CT11' — clé unique visite" }
        erkenningsnummer: { row: 2,  col: "H", dtype: string, optional: true }
        type_test:        { row: 4,  col: "B", dtype: string,
                            note: "'Jaarlijkse test' ou 'Halfjaarlijkse test'" }
        referentie_norm:  { row: 4,  col: "E", dtype: string,
                            note: "Ex: '017-000258-5' (référence KB/AR)" }
        physiciens:
          header_row: null
          data_start_row: 3
          data_end_row: 8
          col_nom:   "G"
          col_riziv: "H"
          dtype: list_of_dict
          note: >
            Nombre variable de physiciens (1 à 6).
            Arrêter à la première ligne vide en col G.

      scanner:
        db_table: "meta/scanner"
        note: >
          Bloc gauche = centre hospitalier (cols A–B).
          Bloc droit  = caractéristiques CT (cols D–E).
          Le numéro de série (row 14 col E) est la clé naturelle du scanner.
        naam_centrum:      { row: 10, col: "B", dtype: string }
        centrum_nummer:    { row: 11, col: "B", dtype: int,
                             note: "Ex: 300 (UZ Leuven)" }
        dienst:            { row: 12, col: "B", dtype: string }
        verantwoordelijke: { row: 13, col: "B", dtype: string }
        zaalnummer:        { row: 14, col: "B", dtype: string,
                             note: "Ex: 'Zaal 11'" }
        adres:             { row: 15, col: "B", dtype: string, optional: true }
        postcode:          { row: 17, col: "B", dtype: string, optional: true }
        gemeente:          { row: 18, col: "B", dtype: string, optional: true }
        modaliteit:        { row: 10, col: "E", dtype: string }
        type_toestel:      { row: 11, col: "E", dtype: string }
        merk:              { row: 12, col: "E", dtype: string,
                             note: "'Siemens', 'Philips', 'GE', 'Canon'..." }
        model:             { row: 13, col: "E", dtype: string,
                             note: "Ex: 'Somatom Force'" }
        serienummer:       { row: 14, col: "E", dtype: string,
                             note: "Clé naturelle scanner — peut être vide!" }
        fabricatiedatum:   { row: 15, col: "E", dtype: int,
                             note: "Année uniquement (ex: 2015) — pas une date complète" }
        installatiedatum:  { row: 16, col: "E", dtype: date,
                             note: "Date complète — format Excel serial" }
        software_versie:   { row: 17, col: "E", dtype: string, optional: true }

      tube_detector:
        db_table: "meta/scanner"
        note: "Extension de meta/scanner — même clé primaire (serienummer)"
        model_buis:          { row: 22, col: "B", dtype: string,
                               note: "Ex: 'Vectron 1041'" }
        serienummer_buis:    { row: 23, col: "B", dtype: string, optional: true }
        fabricatie_buis:     { row: 24, col: "B", dtype: int,    optional: true }
        installatie_buis:    { row: 25, col: "B", dtype: date,   optional: true }
        aantal_slices:       { row: 21, col: "E", dtype: int,
                               note: "Ex: 192" }
        naam_IR:             { row: 23, col: "E", dtype: string,
                               note: "Nom algorithme IR ex: 'ADMIRE', 'iDose', 'SAFIRE'" }
        dual_energy:         { row: 24, col: "E", dtype: bool,
                               bool_map: { "ja": true, "nee": false } }
        CTDI_aanduiding:     { row: 28, col: "E", dtype: string,
                               note: "'CTDI vol' ou 'DLP'" }
        buismodulatie:       { row: 29, col: "E", dtype: string,
                               note: "Ex: 'CareDose', 'DoseRight', 'Auto mA'" }
        organ_based:         { row: 30, col: "E", dtype: bool,
                               bool_map: { "ja": true, "nee": false }, optional: true }
        care_kV:             { row: 31, col: "E", dtype: bool,
                               bool_map: { "ja": true, "nee": false }, optional: true }
        model_detector:      { row: 29, col: "B", dtype: string,
                               note: "Ex: 'Stellar Infinity'" }
        serienummer_det:     { row: 30, col: "B", dtype: string, optional: true }

      aanvaardbaarheid:
        db_table: "meta/qa_visit"
        traceability_only: true
        note: >
          Résultats globaux pass/fail (lignes 40–46).
          Col E = résultat scanner principal, col G = scanner 2 / dual source.
          Col H = flag 'Buiten dienst'.
        CTDI_pass:          { row: 40, col: "E", dtype: string }
        CTDI_pass_b:        { row: 40, col: "G", dtype: string, optional: true }
        buiten_dienst_40:   { row: 40, col: "H", dtype: string, optional: true }
        dosisrapport_pass:  { row: 43, col: "E", dtype: string, optional: true }
        autoexp_pass:       { row: 45, col: "E", dtype: string, optional: true }
        scanner2_pass:      { row: 46, col: "E", dtype: string, optional: true }

  # ── MATERIAAL ───────────────────────────────────────────────────────────────
  materiaal:
    sheet_name: "Materiaal"
    traceability_only: true
    note: >
      Aucune mesure QC. Traçabilité métrologique uniquement.
      Lier à qa_visit via reference_QC (clé étrangère).
    sections:

      dosimeters:
        db_table: "meta/measurement_equipment"
        note: >
          Tableau des 4 Piranha (côté droit, cols I–N, lignes 4–7).
          Col I = label, J = numéro, K = merk, L = SN R100,
          M = SN T20, N = date kalibratie.
        header_row: 3
        data_start_row: 4
        data_end_row: 7
        columns:
          label:            { col: "I", dtype: string }
          numero:           { col: "J", dtype: int }
          merk:             { col: "K", dtype: string }
          SN_R100:          { col: "L", dtype: string }
          SN_T20:           { col: "M", dtype: string }
          datum_kalibratie: { col: "N", dtype: date }

      dosimeter_actif:
        db_table: "meta/measurement_equipment"
        note: "Piranha utilisé lors de cette visite (côté gauche, col C, lignes 4–9)."
        dose_probe_model: { row: 4, col: "C", dtype: string,
                            note: "Ex: 'RTI Piranha'" }
        datum_kalibratie: { row: 5, col: "C", dtype: date }
        SN_dose_probe:    { row: 6, col: "C", dtype: string,
                            note: "Ex: 'R100 SN 1310'" }
        SN_T20:           { row: 7, col: "C", dtype: string,
                            note: "Ex: 'T20 SN 17050'" }
        software:         { row: 8, col: "C", dtype: string,
                            note: "Ex: 'Ocean 2014'" }
        chamber_adapter:  { row: 9, col: "C", dtype: string, optional: true }

      dct10:
        db_table: "meta/measurement_equipment"
        note: "Chambre DCT10 LEMO pour CTDI — ligne 10"
        SN_DCT10: { row: 10, col: "C", dtype: string,
                    note: "Ex: 'CTDI-1823'" }

      fantomen:
        db_table: "meta/phantoms"
        note: "Lignes 11–16 : fantômes cylindriques et Catphan"
        fantoom_32cm: { row: 11, col: "C", dtype: string }
        fantoom_16cm: { row: 12, col: "C", dtype: string }
        catphan_SN:   { row: 13, col: "C", dtype: string,
                        note: "Ex: 'S/N 50462'" }
        catphan_modules:
          note: "Lignes 13–16 col D : modules présents (CTP404/528/515/486)"
          data_start_row: 13
          data_end_row: 16
          col: "D"
          dtype: list_of_string

  # ── FYSISCHE CONTROLE ───────────────────────────────────────────────────────
  fysische_controle:
    sheet_name: "Fysische Controle"
    extract: false
    note: "Lettre de rapport texte — aucune donnée QC structurée."

  # ── VERSLAG ─────────────────────────────────────────────────────────────────
  verslag:
    sheet_name: "Verslag"
    extract: false
    note: >
      Flags booléens CB_* (col M–N) redondants avec pass/fail individuels.
      Exception : datum_verslag peut différer de date_test.
    datum_verslag_ref: { row: 13, col: "H", dtype: date,
                         note: "Optionnel — ajouter dans meta/qa_visit si ≠ date_test",
                         optional: true }

  # ── BUISSPANNING-GEOMETRIE ──────────────────────────────────────────────────
  buisspanning_geometrie:
    sheet_name: "buisspanning-geometrie"
    sections:

      buisspanning_nauwkeurigheid:
        anchor_text: "Buispanning: Nauwkeurigheid"
        anchor_row: 3
        header_row: 5
        data_start_row: 6
        end_condition: { type: empty_cell, row: 6, col: "B" }
        db_table: "tube_voltage/accuracy"
        columns:
          kV_set:        { col: "B", dtype: string }
          kV_measured:   { col: "C", dtype: float, locale_safe: true }
          deviation_pct: { col: "D", dtype: float }
          waveform:      { col: "F", dtype: string, optional: true }

      buisspanning_reproduceerbaarheid:
        header_row: 20
        data_start_row: 21
        end_row: 24
        db_table: "tube_voltage/reproducibility"
        columns:
          kV_set:        { col: "B", dtype: string }
          kV_measured:   { col: "C", dtype: float, locale_safe: true }
          deviation_pct: { col: "D", dtype: float }

      geometrische_efficientie:
        anchor_text: "Geometrische efficiëntie"
        anchor_row: 30
        header_row: 32
        data_start_row: 33
        end_row: 38
        db_table: "geometry/geometric_efficiency"
        columns:
          beam_type:         { col: "A", dtype: string }
          collimation:       { col: "B", dtype: string }
          nominal_scan_len:  { col: "C", dtype: float, unit: mm }
          measured_scan_len: { col: "D", dtype: float, unit: mm }
          efficiency:        { col: "E", dtype: float }
          vendor_definition: { col: "O", dtype: string, optional: true }

      positioneringslicht:
        anchor_text: "Nauwkeurigheid van het positioneringslicht"
        anchor_row: 39
        header_row: 41
        data_start_row: 42
        end_row: 46
        db_table: "geometry/positioning_light"
        columns:
          position:     { col: "B", dtype: string }
          deviation_mm: { col: "D", dtype: float, unit: mm }

      tafelweg:
        anchor_text: "Afgelegde weg van de tafel"
        anchor_row: 48
        header_row: 50
        data_start_row: 51
        end_row: 54
        db_table: "geometry/table_travel"
        columns:
          mode:         { col: "B", dtype: string }
          deviation_mm: { col: "D", dtype: float, unit: mm }

      # C3 CORRIGÉ : pitch et scanned_length_mm sortis de columns: → metadata:
      overscannen:
        anchor_text: "Overscannen"
        anchor_row: 57
        header_row: 59
        data_start_row: 60
        end_row: 66
        db_table: "geometry/overscan"
        metadata:
          pitch:             { row: 60, col: "B", dtype: string,
                               note: "Valeur de pitch — cellule unique hors tableau" }
          scanned_length_mm: { row: 61, col: "D", dtype: float, unit: mm,
                               note: "Longueur scannée mesurée — cellule unique" }
        columns:
          collimation: { col: "B", dtype: string }

      increment:
        anchor_text: "Increment"
        anchor_row: 106
        header_row: 108
        data_start_row: 109
        end_row: 120
        db_table: "geometry/increment"
        columns:
          slice_thickness: { col: "D", dtype: float, unit: mm }
          kernel_type:     { col: "C", dtype: string }
          measured_step:   { col: "F", dtype: float, unit: mm }
          deviation_mm:    { col: "G", dtype: float, unit: mm }
          deviation_rel:   { col: "H", dtype: float }

      pixelgrootte:
        anchor_text: "Verificatie van pixelgrootte"
        anchor_row: 122
        header_row: 124
        data_start_row: 125
        end_row: 127
        db_table: "geometry/pixel_size"
        columns:
          distance_top_mm: { col: "D", dtype: float, unit: mm }
          limit_mm:        { col: "D", row: 127, dtype: float, unit: mm }

      circulaire_symmetrie:
        anchor_text: "Circulaire symmetrie"
        anchor_row: 129
        header_row: 131
        data_start_row: 132
        end_row: 134
        db_table: "geometry/circular_symmetry"
        columns:
          diameter_x_mm: { col: "D", dtype: float, unit: mm }
          diameter_y_mm: { col: "D", row: 132, dtype: float, unit: mm }

  # ── CTDI 32cm ───────────────────────────────────────────────────────────────
  ctdi_32cm:
    sheet_name: "CTDI 32cm"
    sections:

      acquisition_params:
        protocol:       { row: 2, col: "C", dtype: string }
        kernel:         { row: 3, col: "C", dtype: string }
        mAs:            { row: 4, col: "C", dtype: float, unit: mAs }
        collimation:    { row: 5, col: "C", dtype: string }
        collimation_cm: { row: 5, col: "G", dtype: float, unit: cm }
        cycle_time_s:   { row: 6, col: "C", dtype: float, unit: s }
        drecon_mm:      { row: 7, col: "C", dtype: float, unit: mm }
        fov_mm:         { row: 8, col: "C", dtype: float, unit: mm }

      reproducibility:
        header_row: 20
        data_start_row: 21
        end_row: 24
        db_table: "dose/CTDI32_reproducibility"
        columns:
          dose_centre_mGy: { col: "C", dtype: float, unit: mGy }
          deviation_prev:  { col: "D", dtype: float }

      ctdi_kV_table:
        header_row: 32
        data_start_row: 33
        end_row: 41
        db_table: "dose/CTDI32_kV"
        columns:
          kV:                 { col: "A", dtype: float, unit: kV }
          dose_centre_mGy:    { col: "B", dtype: float, unit: mGy }
          dose_top_mGy:       { col: "C", dtype: float, unit: mGy }
          dose_right_mGy:     { col: "D", dtype: float, unit: mGy }
          dose_bottom_mGy:    { col: "E", dtype: float, unit: mGy }
          dose_left_mGy:      { col: "F", dtype: float, unit: mGy }
          dose_mean_mGy:      { col: "G", dtype: float, unit: mGy }
          ctdiw_mGy:          { col: "H", dtype: float, unit: mGy }
          ctdi_indicated_mGy: { col: "I", dtype: float, unit: mGy }

      ctdi_kV_deviation:
        header_row: 45
        data_start_row: 46
        end_row: 54
        db_table: "dose/CTDI32_kV_deviation"
        columns:
          kV:             { col: "A", dtype: float, unit: kV }
          deviation_pct:  { col: "B", dtype: float }
          limit_pct:      { col: "C", dtype: float }
          pass_fail:      { col: "D", dtype: string }
          kV_B:            { col: "F", dtype: float, unit: kV, optional: true }
          deviation_pct_B: { col: "G", dtype: float, optional: true }
          pass_fail_B:     { col: "I", dtype: string, optional: true }
          # Critère 35% étendu (BHPA)
          deviation_35pct: { col: "M", dtype: float, optional: true }
          limit_35pct:     { col: "N", dtype: float, optional: true }
          pass_fail_35pct: { col: "O", dtype: string, optional: true }

      ctdi_collimation:
        header_row: 58
        data_start_row: 59
        end_row: 61
        db_table: "dose/CTDI32_collimation"
        columns:
          collimation:        { col: "B", dtype: string }
          dose_centre_mGy:    { col: "C", dtype: float, unit: mGy }
          dose_top_mGy:       { col: "D", dtype: float, unit: mGy }
          dose_right_mGy:     { col: "E", dtype: float, unit: mGy }
          dose_bottom_mGy:    { col: "F", dtype: float, unit: mGy }
          dose_left_mGy:      { col: "G", dtype: float, unit: mGy }
          dose_mean_mGy:      { col: "H", dtype: float, unit: mGy }
          ctdiw_mGy:          { col: "I", dtype: float, unit: mGy }

      ctdi_linearity:
        header_row: 72
        data_start_row: 73
        end_row: 76
        db_table: "dose/CTDI32_linearity"
        columns:
          kV:                 { col: "A", dtype: float, unit: kV }
          eff_mAs:            { col: "C", dtype: float, unit: mAs }
          slice_thickness_mm: { col: "D", dtype: float, unit: mm }
          dose_centre_mGy:    { col: "E", dtype: float, unit: mGy }
          ctdi_indicated_mGy: { col: "F", dtype: float, unit: mGy }
          signal_HU:          { col: "H", dtype: float, unit: HU }
          noise_SD:           { col: "I", dtype: float, unit: HU }
          SNR:                { col: "J", dtype: float }

      ctdi_linearity_iterative:
        header_row: 78
        data_start_row: 79
        end_row: 82
        db_table: "dose/CTDI32_linearity_iterative"
        skip_if_value: "NGEMETEN"
        skip_col: "E"
        columns:
          kV:                 { col: "A", dtype: float, unit: kV }
          eff_mAs:            { col: "C", dtype: float, unit: mAs }
          slice_thickness_mm: { col: "D", dtype: float, unit: mm }
          dose_centre_mGy:    { col: "E", dtype: float, unit: mGy }
          ctdi_indicated_mGy: { col: "F", dtype: float, unit: mGy }
          signal_HU:          { col: "H", dtype: float, unit: HU }
          noise_SD:           { col: "I", dtype: float, unit: HU }
          SNR:                { col: "J", dtype: float }

      ctdi_verification_standard:
        anchor_text: "CTDI: Verificatie"
        anchor_row: 101
        db_table: "dose/CTDI32_verification_standard"
        acquisition_params:
          protocol: { row: 102, col: "C", dtype: string }
          pitch:    { row: 102, col: "G", dtype: float }
        header_row: 104
        data_start_row: 105
        end_row: 105
        columns:
          dose_centre_mGy:    { col: "B", dtype: float, unit: mGy }
          dose_top_mGy:       { col: "C", dtype: float, unit: mGy }
          dose_right_mGy:     { col: "D", dtype: float, unit: mGy }
          dose_bottom_mGy:    { col: "E", dtype: float, unit: mGy }
          dose_left_mGy:      { col: "F", dtype: float, unit: mGy }
          dose_mean_mGy:      { col: "G", dtype: float, unit: mGy }
          ctdiw_mGy:          { col: "H", dtype: float, unit: mGy }
          ctdi_indicated_mGy: { col: "I", dtype: float, unit: mGy }
        deviation_row: 108
        deviation_cols:
          deviation_pct: { col: "B", dtype: float }
          limit_pct:     { col: "C", dtype: float }
          pass_fail:     { col: "D", dtype: string }

      ctdi_verification_dual_source:
        anchor_text: "CTDI: Verificatie"
        anchor_row: 111
        db_table: "dose/CTDI32_verification_DS"
        acquisition_params:
          protocol:  { row: 112, col: "C", dtype: string }
          kV_tubeA:  { row: 113, col: "C", dtype: string }
          mAs_tubeA: { row: 114, col: "C", dtype: float, unit: mAs }
          kV_tubeB:  { row: 113, col: "G", dtype: string,
                       note: "Peut contenir 'Sn150' — dtype string obligatoire" }
          mAs_tubeB: { row: 114, col: "G", dtype: float, unit: mAs }
        header_row: 116
        data_start_row: 117
        end_row: 117
        columns:
          dose_centre_mGy:    { col: "B", dtype: float, unit: mGy }
          dose_top_mGy:       { col: "C", dtype: float, unit: mGy }
          dose_right_mGy:     { col: "D", dtype: float, unit: mGy }
          dose_bottom_mGy:    { col: "E", dtype: float, unit: mGy }
          dose_left_mGy:      { col: "F", dtype: float, unit: mGy }
          dose_mean_mGy:      { col: "G", dtype: float, unit: mGy }
          ctdiw_mGy:          { col: "H", dtype: float, unit: mGy }
          ctdi_indicated_mGy: { col: "I", dtype: float, unit: mGy }
        deviation_row: 120
        deviation_cols:
          deviation_pct: { col: "B", dtype: float }
          limit_pct:     { col: "C", dtype: float }
          pass_fail:     { col: "D", dtype: string }

  # ── RUIS DETECTORRIJ ────────────────────────────────────────────────────────
  ruis_detectorrij:
    sheet_name: "Ruis Detectorrij"
    sections:

      acquisition_params:
        scan_type:   { row: 2,  col: "A", dtype: string }
        protocol:    { row: 3,  col: "D", dtype: string }
        kV_ref:      { row: 4,  col: "D", dtype: float, unit: kV }
        mAs:         { row: 5,  col: "D", dtype: float, unit: mAs }
        collimation: { row: 6,  col: "D", dtype: string }
        drecon_mm:   { row: 7,  col: "D", dtype: float, unit: mm }
        fov_mm:      { row: 8,  col: "D", dtype: float, unit: mm }
        kernel_soft: { row: 10, col: "D", dtype: string }

      detector_rows:
        header_row: 3
        data_start_row: 4
        end_condition: { type: empty_col, col: "K" }
        db_table: "noise/detector_row"
        columns:
          slice_number: { col: "K", dtype: int }
          tube_current: { col: "L", dtype: float, unit: mA }
          exposure_mAs: { col: "M", dtype: float, unit: mAs }
          mean_HU:      { col: "N", dtype: float, unit: HU }
          stddev_HU:    { col: "O", dtype: float, unit: HU }

      limits:
        angle_0_lower:  { row: 3, col: "R", dtype: float }
        angle_0_upper:  { row: 3, col: "S", dtype: float }
        angle_90_lower: { row: 4, col: "R", dtype: float }
        angle_90_upper: { row: 4, col: "S", dtype: float }

  # ── BUISSTROOMMODULATIE ─────────────────────────────────────────────────────
  buisstroommodulatie:
    sheet_name: "Buisstroommodulatie"
    sections:

      setup_metadata:
        phantom_32cm: { row: 3, col: "B", dtype: string }
        phantom_16cm: { row: 3, col: "G", dtype: string }

      z_dikte_tcm_aan:
        db_table: "tcm/z_dikte_tcm_aan"
        metadata:
          label:         { row: 15, col: "T", dtype: string }
          tcm_state:     { row: 16, col: "T", dtype: string }
          encoded_params:
            row: 17
            col: "S"
            dtype: string
            note: >
              Cellule unique encodant kVp/mAs/slice/kernel.
              Format: "Buismodulatie kVp: 120 mAs: 218 slice: 3 Br40d"
              Parser regex: kVp:\s*(\d+)\s+mAs:\s*(\d+)\s+slice:\s*([\d.]+)\s+(\S+)
        header_row: 18
        data_start_row: 19
        end_condition: { type: empty_col, col: "S" }
        columns:
          tube_current_mA: { col: "S", dtype: float, unit: mA }
          exposure_mAs:    { col: "T", dtype: float, unit: mAs }
          mean_HU:         { col: "U", dtype: float, unit: HU }
          stddev_HU:       { col: "V", dtype: float, unit: HU }

      z_dikte_tcm_af:
        db_table: "tcm/z_dikte_tcm_af"
        metadata:
