      collimatie:      { row: 23, col: "D", dtype: string }
      rotatietijd:     { row: 24, col: "D", dtype: float }
      pitch:           { row: 25, col: "D", dtype: float }
      slice_mm:        { row: 26, col: "D", dtype: float }
      CTDIvol:         { row: 27, col: "D", dtype: float }
      FOV:             { row: 28, col: "D", dtype: int }
      scan_mode:       { row: 29, col: "D", dtype: string }
      kernel_soft:     { row: 31, col: "D", dtype: string }   # zacht weefsel
      kernel_hard:     { row: 32, col: "D", dtype: string }   # bot weefsel
      max_kVp:         { row: 31, col: "G", dtype: int }
      min_kVp:         { row: 32, col: "G", dtype: int }
      mAs_high:        { row: 31, col: "I", dtype: float }    # >120 mAs
      mAs_low:         { row: 32, col: "I", dtype: float }    # <120 mAs
