      afwijking_mm:    { row: 40, col: "D", dtype: float }
      limiet_mm:       { row: 41, col: "D", dtype: float }
      pass_fail:       { row: 42, col: "D", dtype: string }


    CT_nummer_ruis_in_tijd:
      note: >
        "CT nummer & Ruis in de tijd" — test longitudinal de stabilité HU et bruit.
