        ref_HU_delrin:      { col: "R", dtype: float, unit: HU, optional: true }
        ref_HU_teflon:      { col: "S", dtype: float, unit: HU, optional: true }

    correlatie_buisB:
      note: "Coefficients de corrélation tube B. 2 lignes (Br40 + Br59)."
      db_table: "iq/DS_correlatie_buisB"
      header_row: 104
      data_start_row: 105
      end_condition:
        type: n_rows
        n: 2
      columns:
        filter_kV_label: { col: "A", dtype: string }
        correlatie_R:    { col: "E", dtype: float }
        limiet:          { col: "F", dtype: string }
        pass_fail:       { col: "G", dtype: string }

    HU_water_lucht_mixed:
      note: >
        Vérification HU eau et HU air sur image mixed.
        6 lignes (Br40/Br59 × 3 kVp).
        Critères : |HU_water| < 10 HU, HU_lucht dans tolérance.
        Cols Q–S = données CodeImageJ (HU + SD) pour traçabilité.
      db_table: "iq/DS_HU_water_lucht_mixed"
      header_row: 110
      data_start_row: 111
      end_condition:
        type: n_rows
        n: 6
      columns:
        filter_kV_label: { col: "A", dtype: string }
        HU_water:        { col: "C", dtype: float, unit: HU }
        limiet_water:    { col: "D", dtype: string }
        pass_fail_water: { col: "E", dtype: string }
        HU_lucht:        { col: "H", dtype: float, unit: HU }
        pass_fail_lucht: { col: "J", dtype: string }
        pass_fail_total: { col: "L", dtype: string, optional: true }
      totaal:
        pass_fail_water: { row: 117, col: "L", dtype: string }
        pass_fail_lucht: { row: 117, col: "N", dtype: string }

    HU_water_lucht_buisB:
      note: >
        Vérification HU eau et HU air tube B seul.
        Seules 2 lignes sont valides (100/Sn150 kV, Br40 + Br59).
        Les autres lignes (80/Sn150, 90/Sn150) contiennent NVT.
        Parser : ignorer les lignes où pass_fail == "NVT".
      db_table: "iq/DS_HU_water_lucht_buisB"
      header_row: 118
      data_start_row: 119
      end_condition:
        type: n_rows
        n: 6
      skip_if_value: "NVT"
      skip_col: "E"
      columns:
        filter_kV_label: { col: "A", dtype: string }
        HU_water:        { col: "C", dtype: float, unit: HU }
        limiet_water:    { col: "D", dtype: string }
        pass_fail_water: { col: "E", dtype: string }
        HU_lucht:        { col: "H", dtype: float, unit: HU }
        pass_fail_lucht: { col: "J", dtype: string }
      totaal:
        pass_fail_water: { row: 125, col: "L", dtype: string }
        pass_fail_lucht: { row: 125, col: "N", dtype: string }

    uniformiteit_mixed:
      note: >
        Uniformité sur image mixed.
        12 lignes de données : 6 kVp × 2 sous-lignes (HU row, SD row).
        Col B indique "HU" ou "SD". ROI centraal–links en cols C–G, gemiddelde en H,
        Max. Uniformiteit HU en I, Max. Uniformiteit (%) en J.
        Les named_results (UNIFDS...I) en col AG sont sur les lignes HU uniquement
        (rows 131, 133, 135, 137, 139, 141).
      db_table: "iq/DS_uniformiteit_mixed"
      header_row: 130
      data_start_row: 131
      end_condition:
        type: n_rows
        n: 12
      columns:
        filter_kV_label:   { col: "A", dtype: string }
        row_type:          { col: "B", dtype: string,
                             note: "'HU' ou 'SD'" }
        ROI_centraal:      { col: "C", dtype: float }
        ROI_boven:         { col: "D", dtype: float }
        ROI_rechts:        { col: "E", dtype: float }
        ROI_onder:         { col: "F", dtype: float }
        ROI_links:         { col: "G", dtype: float }
        gemiddelde:        { col: "H", dtype: float }
        max_unif_HU:       { col: "I", dtype: float, unit: HU }
        max_unif_pct:      { col: "J", dtype: float }
      named_results:
        note: "Col AG sur les lignes HU (rows 131, 133, 135, 137, 139, 141)."
        UNIFDS120SoftI:  { row: 131, col: "AG", dtype: string }
        UNIFDS120HardI:  { row: 133, col: "AG", dtype: string }
        UNIFDS140SoftI:  { row: 135, col: "AG", dtype: string }
        UNIFDS140HardI:  { row: 137, col: "AG", dtype: string }
        UNIFDS100SoftI:  { row: 139, col: "AG", dtype: string }
        UNIFDS100HardI:  { row: 141, col: "AG", dtype: string }
      summary_table:
        note: "Résumé par filtre+kVp : Max. Uniformiteit HU vs limiet, pass_fail."
        db_table: "iq/DS_uniformiteit_mixed_summary"
        header_row: 144
        data_start_row: 145
        end_condition:
          type: n_rows
          n: 6
        columns:
          filter_kV_label: { col: "A", dtype: string }
          max_unif_HU:     { col: "B", dtype: float, unit: HU }
          limiet_HU:       { col: "C", dtype: float, unit: HU }
          pass_fail:       { col: "D", dtype: string }
      pass_fail_totaal:    { row: 129, col: "K", dtype: string }

    uniformiteit_buisB:
      note: >
        Uniformité tube B seul, à 100/Sn150 kV uniquement.
        4 lignes : Br40 + Br59 × 2 sous-lignes (HU + SD).
      db_table: "iq/DS_uniformiteit_buisB"
      header_row: 157
      data_start_row: 158
      end_condition:
        type: n_rows
        n: 4
      columns:
        filter_kV_label:   { col: "A", dtype: string }
        row_type:          { col: "B", dtype: string,
                             note: "'HU' ou 'SD'" }
        ROI_centraal:      { col: "C", dtype: float }
        ROI_boven:         { col: "D", dtype: float }
        ROI_rechts:        { col: "E", dtype: float }
        ROI_onder:         { col: "F", dtype: float }
        ROI_links:         { col: "G", dtype: float }
        gemiddelde:        { col: "H", dtype: float }
        max_unif_HU:       { col: "I", dtype: float, unit: HU }
        max_unif_pct:      { col: "J", dtype: float }
      summary_table:
        note: "2 lignes de résumé (Br40 + Br59)."
        db_table: "iq/DS_uniformiteit_buisB_summary"
        header_row: 163
        data_start_row: 164
        end_condition:
          type: n_rows
          n: 2
        columns:
          filter_kV_label: { col: "A", dtype: string }
          max_unif_HU:     { col: "B", dtype: float, unit: HU }
          limiet_HU:       { col: "C", dtype: float, unit: HU }
          pass_fail:       { col: "D", dtype: string }
      pass_fail_totaal:    { row: 154, col: "Q", dtype: string }

    artefacten:
      note: "Pass/fail visuel unique — pas de valeur numérique à stocker."
      pass_fail: { row: 169, col: "H", dtype: string }

  # ── SNEDEDIKTE ──────────────────────────────────────────────────────────────
  snededikte:
    sheet_name: "Snededikte"
    sections:

      acquisition_params:
        scan_type:     { row: 2, col: "A", dtype: string }
        protocol:      { row: 3, col: "D", dtype: string }
        drecon_gt2mm:  { row: 6, col: "D", dtype: float, unit: mm }
        drecon_lt2mm:  { row: 6, col: "G", dtype: float, unit: mm }
        kernel_soft:   { row: 8, col: "D", dtype: string }
        kernel_hard:   { row: 9, col: "D", dtype: string }

      slice_thickness_gt2mm:
        header_row: 11
        data_start_row: 12
        end_row: 13
        db_table: "geometry/slice_thickness_gt2mm"
        bhpa_criterion: "deviation_abs_mm < 1 mm"
        columns:
          size_category:      { col: "B", dtype: string }
          kernel:             { col: "C", dtype: string }
          fwhm_measured_mm:   { col: "D", dtype: float, unit: mm }
          nominal_mm:         { col: "E", dtype: float, unit: mm }
          deviation_abs_mm:   { col: "F", dtype: float, unit: mm }
          deviation_rel:      { col: "G", dtype: float }

      slice_thickness_lt2mm:
        header_row: 18
        data_start_row: 19
        end_row: 20
        db_table: "geometry/slice_thickness_lt2mm"
        bhpa_criterion: "deviation_rel < 0.5 (50%)"
        columns:
          size_category:    { col: "B", dtype: string }
          kernel:           { col: "C", dtype: string }
          fwhm_measured_mm: { col: "D", dtype: float, unit: mm }
          nominal_mm:       { col: "E", dtype: float, unit: mm }
          deviation_abs_mm: { col: "F", dtype: float, unit: mm }
          deviation_rel:    { col: "G", dtype: float }

  # ── PROTOCOLLEN ─────────────────────────────────────────────────────────────
  protocollen:
    sheet_name: "protocollen"
    sections:

      adult_protocols:
        anchor_text: "Scan Param"
        header_row: 4
        data_start_row: 5
        end_condition: { type: empty_col, col: "A" }
        db_table: "protocols/adult"
        columns:
          protocol_name: { col: "A", dtype: string }
          kV:            { col: "B", dtype: string,
                           note: "dtype string — peut contenir 'Sn150' ou '90/Sn150'" }
          eff_mAs:       { col: "C", dtype: float, unit: mAs }
          pitch:         { col: "D", dtype: float }
          collimation:   { col: "E", dtype: string,  optional: true }
          CTDIvol_mGy:   { col: "F", dtype: float,   unit: mGy, optional: true }
          DLP_mGycm:     { col: "G", dtype: float,   unit: "mGy·cm", optional: true }

      child_protocols:
        anchor_text: "Scan Param"
        anchor_occurrence: 2
        header_row: 21
        data_start_row: 22
        end_condition: { type: empty_col, col: "A" }
        db_table: "protocols/pediatric"
        columns:
          protocol_name:    { col: "A", dtype: string }
          kV:               { col: "B", dtype: string }
          eff_mAs:          { col: "C", dtype: float, unit: mAs }
          feed_per_rot_mm:  { col: "H", dtype: float, unit: mm,
                              note: "feed/rotation — différent du pitch adulte" }
          collimation:      { col: "E", dtype: string,  optional: true }
          CTDIvol_mGy:      { col: "F", dtype: float,   unit: mGy, optional: true }
          DLP_mGycm:        { col: "G", dtype: float,   unit: "mGy·cm", optional: true }
