  # ── CTDI 16cm ───────────────────────────────────────────────────────────────
  ctdi_16cm:
    sheet_name: "CTDI 16cm"
    note: >
      Onglet simplifié : seuls les paramètres d'acquisition et le tableau CTDI vs kV
      sont extraits (aligné sur l'approche de Kwinten Torfs 2022).
      Les sections de déviation, collimation, linéarité et vérification
      présentes dans CTDI 32cm ne figurent pas dans cet onglet.
    sections:

      acquisition_params:
        db_table: "dose/CTDI16_settings"
        protocol:         { row: 2,  col: "C", dtype: string }
        kernel:           { row: 3,  col: "C", dtype: string }
        mAs:              { row: 4,  col: "C", dtype: float, unit: mAs }
        collimation:      { row: 5,  col: "C", dtype: string }
        cycle_time_s:     { row: 6,  col: "C", dtype: float, unit: s }
        snededikte_mm:    { row: 7,  col: "C", dtype: float, unit: mm }
        fov_mm:           { row: 8,  col: "C", dtype: float, unit: mm }
        positie_fantoom:  { row: 9,  col: "C", dtype: string,
                            note: "Ex: 'hoofdsteun' — spécifique au fantôme 16cm" }

      ctdi_kV_table:
        header_row: 12
        data_start_row: 13
        end_row: 22
        db_table: "dose/CTDI16_kV"
        note: >
          Tableau CTDI en fonction du kV.
          Col J = basiswaarde (mGy) — valeur de référence historique établie
          lors de la première visite; utilisée pour le suivi longitudinal.
        columns:
          kV:                 { col: "A", dtype: float, unit: kV }
          dose_centre_mGy:    { col: "B", dtype: float, unit: mGy }
          dose_top_mGy:       { col: "C", dtype: float, unit: mGy }
          dose_right_mGy:     { col: "D", dtype: float, unit: mGy }
          dose_bottom_mGy:    { col: "E", dtype: float, unit: mGy }
          dose_left_mGy:      { col: "F", dtype: float, unit: mGy }
          dose_periph_mean_mGy: { col: "G", dtype: float, unit: mGy,
                                  note: "Gemiddelde periferie" }
          ctdi_berekend_mGy:  { col: "H", dtype: float, unit: mGy,
                                note: "Berekende CTDI (mesurée)" }
          ctdi_aangeduid_mGy: { col: "I", dtype: float, unit: mGy,
                                note: "Aangeduide CTDI (indiquée par le scanner)" }
          basiswaarde_mGy:    { col: "J", dtype: float, unit: mGy,
                                note: "Valeur de référence — NaN si première visite" }

  # ── BEELDKWALITEIT ──────────────────────────────────────────────────────────
  beeldkwaliteit:
    sheet_name: "Beeldkwaliteit"
    inject_columns:
      recon_type: "FBP"
      source_type: "single_source"
    is_dual_source: false
    is_iterative: false
    extract: true

    referentieopname:                       # lignes 3–15 col C/D
      patient_name:    { row: 4,  col: "D", dtype: string }
      protocol:        { row: 6,  col: "D", dtype: string }
      ref_kVp:         { row: 7,  col: "D", dtype: int,    unit: kV }
      eff_mAs:         { row: 8,  col: "D", dtype: float,  unit: mAs }
      collimatie:      { row: 9,  col: "D", dtype: string }
      rotatietijd:     { row: 10, col: "D", dtype: float,  unit: s }
      pitch:           { row: 11, col: "D", dtype: float }
      slice_mm:        { row: 12, col: "D", dtype: float,  unit: mm }
      CTDIvol:         { row: 13, col: "D", dtype: float,  unit: mGy }
      FOV:             { row: 14, col: "D", dtype: int,    unit: mm }
      scan_mode:       { row: 15, col: "D", dtype: string }   # "spiraal" ou "sequentieel"

    referentiescan:                          # lignes 19–29, cols C/D + K/L/M/N/O
